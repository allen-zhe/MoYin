name: Feature request
description: 提出一个功能建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 请描述当前工作流中的痛点
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
  - type: checkboxes
    id: scope
    attributes:
      label: 影响范围
      options:
        - label: 打印 / 打印机
        - label: 堆叠 / 快捷打印
        - label: 标签 / 拼版
        - label: 金额 / 收款
        - label: 手机传输 / ERP
        - label: 安装 / 更新
