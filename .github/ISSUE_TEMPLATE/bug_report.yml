name: Bug report
description: 报告一个可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量提供可复现步骤；不要上传包含客户隐私的文件。
  - type: input
    id: version
    attributes:
      label: 墨印版本
      description: 窗口标题或安装包文件名中的版本号
      placeholder: "0.9.7"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: "Windows 11 23H2"
    validations:
      required: true
  - type: input
    id: printer
    attributes:
      label: 打印机型号
      placeholder: "HP LaserJet Pro M403d / EPSON L15150"
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从打开应用开始，按顺序写出操作
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 可选；请先移除隐私信息
